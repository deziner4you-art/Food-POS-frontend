version: '3.8'
services:
  # Unused for now: the backend below connects to the existing native
  # Postgres already running on the host (127.0.0.1:5432, has the real
  # live data). Left here in case we ever want to containerize the DB too.
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: d4u_postgres
  #   environment:
  #     POSTGRES_USER: root
  #     POSTGRES_PASSWORD: rootpassword
  #     POSTGRES_DB: d4u_pos_db
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: d4u_backend
    # Node runs as PID 1 with no signal/zombie-process reaping of its own;
    # without an init process a container can get stuck un-stoppable. This
    # runs Docker's built-in tini as PID 1 instead.
    init: true
    env_file:
      - .env
    environment:
      # Overrides .env's 127.0.0.1 (which inside the container would mean
      # the container itself) so the app reaches the host's real Postgres.
      DATABASE_URL: "postgresql://postgres:postgres@host.docker.internal:5432/d4u_pos_db?schema=public"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    volumes:
      # A host bind-mount here (./uploads:/app/uploads) uses Docker Desktop's
      # Windows file-sharing layer (grpcfuse), which hung completely under
      # this folder's size/file count -- every request under /uploads/* (even
      # a plain `ls` inside the container) would hang indefinitely until
      # Docker Desktop was restarted, which is why banner/product images kept
      # intermittently vanishing. A named volume lives natively inside the
      # Linux VM, bypassing that bridge entirely. One-time migration of the
      # existing files out of the old bind-mounted folder into this volume is
      # a manual step (see MEMORY.md / session notes), not automatic.
      - d4u_uploads:/app/uploads
    restart: unless-stopped

volumes:
  d4u_uploads:
    external: true
    name: d4u-pos-backend_d4u_uploads
  # postgres_data: (would pair with the commented-out postgres service above)
