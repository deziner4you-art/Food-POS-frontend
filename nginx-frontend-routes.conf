# -------------------------------------------------------------
# pos.deziner4you.com Additional Routes
# The main server root is assumed to be /www/wwwroot/d4u-pos-client/
# -------------------------------------------------------------

# --- Redirect bare URLs to ensure trailing slashes ---
location = /admin {
    return 301 /admin/;
}

location = /rider {
    return 301 /rider/;
}

location = /website {
    return 301 /website/;
}

# --- SPA Directory Mappings ---

# Map /admin/ requests to the separate d4u-admin directory
location ^~ /admin/ {
    alias /www/wwwroot/d4u-admin/;
    index index.html;
    access_log off;
    
    # SPA Fallback for Admin
    try_files $uri $uri/ /admin/index.html;
}

# Map /rider/ requests to the separate d4u-rider directory
location ^~ /rider/ {
    alias /www/wwwroot/d4u-rider/;
    index index.html;
    access_log off;
    
    # SPA Fallback for Rider
    try_files $uri $uri/ /rider/index.html;
}

# Map /website/ requests to the separate d4u-website directory
location ^~ /website/ {
    alias /www/wwwroot/d4u-website/;
    index index.html;
    access_log off;
    
    # SPA Fallback for Website
    try_files $uri $uri/ /website/index.html;
}
